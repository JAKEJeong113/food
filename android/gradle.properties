org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 백엔드(Next.js) API 주소. 에뮬레이터 기본값은 호스트 머신의 localhost를 가리키는
# 10.0.2.2 입니다. 실기기로 테스트할 때는 같은 네트워크의 PC IP로,
# 배포된 백엔드를 쓸 때는 해당 HTTPS 주소로 덮어쓰세요.
# 예: ./gradlew assembleDebug -PAPI_BASE_URL=https://naengpa.onrender.com/
API_BASE_URL=http://10.0.2.2:3000/
